[project]
name = "eboekhouden-mcp"
version = "0.1.0"
description = "MCP server for the e-boekhouden.nl REST API, generated from its OpenAPI spec"
readme = "README.md"
authors = [
    { name = "g2udevelopment", email = "gh@handsonzero.com" }
]
requires-python = ">=3.12"
license = "MIT"
keywords = ["mcp", "e-boekhouden", "boekhouding", "accounting", "openapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "fastmcp>=4.0.11",
    "httpx2>=2.13.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
eboekhouden-mcp = "eboekhouden_mcp:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "ARG", "PLW", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
